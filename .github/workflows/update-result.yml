name: Update World Cup results

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC (~2pm Malaysia)
  workflow_dispatch: {}    # lets you run it manually from the Actions tab

permissions:
  contents: write          # allow the job to commit results.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node update-results.mjs

      - name: Commit if changed
        run: |
          git config user.name "wc-results-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update World Cup results"
            git push
          fi
